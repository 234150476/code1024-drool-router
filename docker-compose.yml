# See docs/code1024-standalone.md before starting.
services:
  drool:
    build: .
    command: web
    ports:
      - "127.0.0.1:4191:4191"
    environment:
      DROOL_WEB_HOST: "0.0.0.0"
      DROOL_WEB_TOKEN_FILE: /run/secrets/web-token
      SUB2API_ADMIN_KEY_FILE: /run/secrets/sub2api-admin
      # For gateways with protected account export, optionally add:
      # SUB2API_ACCOUNT_CREDENTIALS_FILE: /run/secrets/accounts.json
    volumes:
      - ./config.json:/etc/drool-detector/config.json:ro
      - ./credentials:/run/secrets:ro
      - drool-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped

volumes:
  drool-data:
